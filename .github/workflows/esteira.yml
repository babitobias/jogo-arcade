name: esteira-jogo
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: esteira-${{ github.ref }}
  cancel-in-progress: false               # nunca interromper um deploy no meio

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                  # gitleaks precisa do histórico
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Testes de unidade e integração (cobertura + JUnit)
        run: npm run test:ci
      - name: Segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependências e SBOM
        run: |
          mkdir -p reports
          npm audit --omit=dev --audit-level=critical | tee reports/npm-audit.txt
          npm sbom --sbom-format cyclonedx > reports/sbom.json
      - name: Build versionado
        run: npm run build
      - name: GDD em PDF
        run: |
          npx playwright install --with-deps chromium
          npm run gdd:pdf
          pdfinfo docs/GDD.pdf
      - name: Pacote da release (build.zip + SHA-256)
        run: |
          (cd dist && zip -qr -X ../build.zip .)
          sha256sum build.zip > build.zip.sha256
          cat build.zip.sha256
          test "$(stat -c%s build.zip)" -lt 26214400   # < 25 MB
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.sha }}
          path: |
            build.zip
            build.zip.sha256
            docs/GDD.pdf
            reports/

  deploy-hml:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write                     # escrever no branch gh-pages
    environment:
      name: homologacao
      url: ${{ vars.SITE_URL }}/hml/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: Publicar em /hml/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publicar.sh hml build.zip
      - name: Esperar propagação do Pages
        run: ./scripts/aguardar.sh "${{ vars.SITE_URL }}/hml/version.json" 300
      - name: Regressão E2E em homologação
        env:
          BASE_URL: ${{ vars.SITE_URL }}/hml/
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  deploy-prd:
    needs: deploy-hml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    environment:
      name: producao                      # revisor obrigatório no environment = gate de aprovação
      url: ${{ vars.SITE_URL }}/
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OBSERVACAO_SEGUNDOS: ${{ vars.OBSERVACAO_SEGUNDOS || '90' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: Publicar release imutável em /releases/<sha>/
        run: |
          echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          ./scripts/publicar.sh release build.zip "${GITHUB_SHA::7}"
      - name: Canário a 10%
        run: ./scripts/rollout.sh canario "${GITHUB_SHA::7}" 10
      - name: Smoke da release com rollback automático
        run: |
          npm ci && npx playwright install --with-deps chromium
          ./scripts/aguardar.sh "${{ vars.SITE_URL }}/releases/${SHA7}/version.json" 300
          if ! BASE_URL="${{ vars.SITE_URL }}/releases/${SHA7}/" npx playwright test tests/e2e/smoke.spec.js; then
            ./scripts/rollout.sh rollback "smoke falhou em ${SHA7}"
            exit 1
          fi
      - name: Observação do canário
        run: |
          sleep "$OBSERVACAO_SEGUNDOS"
          codigo=$(curl -s -L -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}/releases/${SHA7}/version.json")
          if [ "$codigo" != "200" ]; then ./scripts/rollout.sh rollback "observação falhou ($codigo)"; exit 1; fi
      - name: Promover a 100% e smoke na URL pública
        run: |
          ./scripts/rollout.sh promover
          sleep 30
          if ! BASE_URL="${{ vars.SITE_URL }}/" npx playwright test tests/e2e/smoke.spec.js; then
            ./scripts/rollout.sh rollback "smoke pós-promoção falhou em ${SHA7}"
            exit 1
          fi
      - name: Avisar o squad em caso de falha
        if: failure()
        run: |
          gh issue create --title "Deploy falhou: ${SHA7:-${GITHUB_SHA::7}}" --label alerta \
            --body "A esteira falhou (rollback aplicado quando cabível). Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

  pacote:
    needs: deploy-prd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: Montar pacote de submissão
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: ./scripts/pacote.sh
      - name: Triagem como código
        env:
          PRAZO: ${{ vars.PRAZO }}
        run: |
          npm ci && npx playwright install --with-deps chromium
          ./scripts/triagem.sh submissao
      - uses: actions/upload-artifact@v4
        with:
          name: submissao-${{ github.sha }}
          path: submissao/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: Conferir tag x package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} diferente de package.json v$v"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build.zip build.zip.sha256 reports/sbom.json docs/GDD.pdf \
            --title "${GITHUB_REF_NAME}" --generate-notes
